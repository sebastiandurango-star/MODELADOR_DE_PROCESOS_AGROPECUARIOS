<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biorreactor Agropecuario</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#f8fafc;padding:24px}
.box{max-width:720px;margin:auto;background:#1e293b;padding:24px;border-radius:12px}
canvas{width:100%;height:260px;background:#0b1220;border-radius:10px;margin-top:14px}
</style>
</head>
<body>
<div class="box">
<h2>Biorreactor Agropecuario</h2>
<label>Tiempo: <span id="lbl">0 días</span></label><br>
<input id="t" type="range" min="0" max="30" step="0.5" value="0" style="width:100%;height:28px">
<canvas id="c" width="600" height="260"></canvas>
</div>
<script>
const t=document.getElementById('t'),lbl=document.getElementById('lbl'),ctx=document.getElementById('c').getContext('2d');
function draw(){
  const v=parseFloat(t.value)/30;
  lbl.textContent=t.value+' días';
  ctx.clearRect(0,0,600,260);
  ctx.strokeStyle='#94a3b8';
  ctx.strokeRect(180,30,240,190);
  const h=150*(1-v*0.4);
  ctx.fillStyle='#6b4423';
  ctx.fillRect(182,218-h,236,h);
  ctx.fillStyle='#22c55e';
  ctx.font='16px system-ui';
  ctx.fillText('Descomposición: '+Math.round(v*100)+'%',20,30);
}
t.oninput=draw;draw();
</script>
</body>
</html>
